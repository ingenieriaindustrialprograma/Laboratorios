  --c-fin:#009E73; --c-geio:#E69F00; --c-log:#0072B2; --c-mf:#D55E00; --c-con:#CC79A7;

    --good:#4cc38a; --good-soft:#12342a; --warn:#f0a35a; --bad:#ff8077; --bad-soft:#3b1a19; --c-log:#3da0e0; --on-log:#04121c;
    --shadow:0 10px 28px -16px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0f1d; --grid:#151d33; --surface:#111a2f; --surface2:#172240; --ink:#eaf0ff; --ink2:#b7c2dc; --ink3:#7e8bab; --line:#222e4a;
  --accent:#b4c4ff; --on-accent:#0a1226; --focus:#8fa8ff; --accent-soft:#1a2750; --hero:#060b18;
  --good:#4cc38a; --good-soft:#12342a; --warn:#f0a35a; --bad:#ff8077; --bad-soft:#3b1a19; --c-log:#3da0e0; --on-log:#04121c;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.4px);background-size:24px 24px;color:var(--ink);font:16px/1.6 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.top{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:16px 0 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 auto;min-width:0;font:600 15px var(--display)}
.brand small{display:block;font:400 12px var(--body);color:var(--ink3)}
.mark{display:grid;grid-template-columns:repeat(3,9px);gap:3px}
.mark i{width:9px;height:9px;border-radius:50%;background:var(--lc)}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 13px;color:var(--ink2);text-decoration:none;font-size:14px;font-weight:500}
.ghost:hover{border-color:var(--ink3);color:var(--ink)}
.ghost[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.prog{max-width:1080px;margin:0 auto 6px;display:flex;gap:6px;align-items:center}
.prog button{flex:1 1 0;min-width:30px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font:600 12px var(--mono);color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px;transition:flex .35s ease}
.prog button.done{background:var(--accent-soft);color:var(--ink2);border-color:transparent}
.prog button[aria-current="step"]{flex:4 1 0;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
#stage{max-width:1080px;margin:0 auto;outline:none}
.slide{display:flex;flex-direction:column;gap:24px;padding:28px 0 12px;min-height:56vh;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{display:flex;align-items:center;gap:10px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.kicker::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--ink)}
h1{font-size:clamp(28px,4.4vw,48px);line-height:1.04;font-weight:700;max-width:21ch}
.lead{font-size:clamp(17px,2vw,21px);color:var(--ink2);max-width:58ch}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:13px 24px;font-weight:600;font-size:17px;box-shadow:0 8px 20px -10px var(--accent)}
.btn:hover{filter:brightness(1.12)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:16px;min-width:0}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.muted{color:var(--ink3)}
.big{font:700 clamp(40px,5.2vw,64px)/1.02 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.03em}
.cap{font-size:17px;color:var(--ink2);line-height:1.45}
.stat{display:flex;flex-direction:column;gap:12px}
.mbar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.mbar span{display:block;height:100%;border-radius:4px;background:var(--ink);transition:width .6s ease}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 9px;background:var(--surface);white-space:nowrap}
.dot{width:11px;height:11px;border-radius:50%;background:var(--lc);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:14px;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:10px 18px;color:var(--ink2);font-weight:500;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;align-items:center;background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:clamp(22px,3.4vw,40px);position:relative;overflow:hidden;
  background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:40px 40px;box-shadow:0 30px 60px -30px rgba(6,11,24,.7)}
.hero .kicker{color:var(--hero-ink2)}.hero .kicker::before{background:var(--hero-ink)}
.hero h1{font-size:clamp(32px,5vw,56px);max-width:13ch;color:var(--hero-ink)}
.hero .lead{color:var(--hero-ink2)}
.hero .tag{background:rgba(255,255,255,.07);border-color:var(--hero-line);color:var(--hero-ink)}
.hero .btn{background:#fff;color:#0a1226;box-shadow:0 10px 24px -10px rgba(255,255,255,.4)}
.hero .txt{display:flex;flex-direction:column;gap:20px}
.cluster{display:grid;grid-template-columns:repeat(9,1fr);gap:clamp(7px,1.2vw,13px)}
.cd{aspect-ratio:1;border-radius:50%;background:var(--lc);box-shadow:0 0 0 3px rgba(255,255,255,.06),0 0 18px -2px var(--lc);animation:pop .6s cubic-bezier(.2,.8,.3,1.3) both;animation-delay:calc(var(--i)*22ms)}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
.dots{display:flex;flex-wrap:wrap;gap:10px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.dt{width:30px;height:30px;border-radius:50%;border:2px solid var(--lc,var(--line));background:var(--lc);padding:0;transition:background-color .5s,border-color .5s,transform .15s,box-shadow .5s;box-shadow:0 0 0 4px color-mix(in srgb,var(--lc) 18%,transparent)}
.dt.off{border-color:var(--ink3);border-style:dashed;background:transparent;box-shadow:none}
.dt:hover{transform:scale(1.25)}
.lab{position:relative;display:flex;flex-direction:column;gap:12px;padding-top:24px;overflow:hidden}
.lab::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--lc)}
.lab .hd{display:flex;align-items:center;gap:12px}
.badge{width:46px;height:46px;border-radius:13px;background:var(--lc);color:var(--on);font:600 12px var(--mono);display:grid;place-items:center;flex:none;letter-spacing:.02em}
.lab h3{font-size:17px;line-height:1.2}
.lab>p{font-size:14px;line-height:1.5}
.lab ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14px}
.lab .num b{font:700 32px var(--display);letter-spacing:-.03em}
.lab .num{color:var(--ink2);font-size:13px}
details summary{cursor:pointer;color:var(--ink);font-weight:600;font-size:14px}
details ul{margin-top:8px;font-size:13px;color:var(--ink2)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.bcol{background:var(--surface2);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:7px;border-top:6px solid var(--lc)}
.bhead{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;padding:2px 2px 4px}
.bhead b{margin-left:auto;font:700 20px var(--display)}
.pill{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 9px;font-size:13px;line-height:1.3;transition:transform .12s,border-color .12s}

.pill.sel{outline:3px solid var(--focus);outline-offset:1px}
.pill .sm{color:var(--ink3);font:500 11px var(--mono);display:block;margin-bottom:1px}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:stretch}

.nav button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 22px;font-weight:600}
.nav button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.nav button:disabled{opacity:.35;cursor:default}
#count{font:500 13px var(--mono);color:var(--ink3);text-align:center}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--hero);color:var(--hero-ink);padding:8px 11px;border-radius:10px;font-size:13px;max-width:300px;box-shadow:0 10px 30px rgba(0,0,0,.3)}

  .g3,.g5,.board{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}

  const out = h('div'), lbl = h('b');
  const ej = [['Ana', 4.5, 2.8], ['Luis', 2.5, 4.4], ['Marta', 3.8, 3.6]];
  const slider = h('input', {type:'range', id:'w', min:'10', max:'40', step:'5', value:String(state.w), oninput:e => { state.w = +e.target.value; draw(); }});
  const seg = h('div', {class:'seg', role:'group', 'aria-label':'Regla'}, [[true, 'Sí, hay que aprobarlo'], [false, 'No, solo suma']].map(o => h('button', {type:'button', 'aria-pressed':String(state.must === o[0]), onclick:e => { state.must = o[0]; [...seg.children].forEach(b => b.setAttribute('aria-pressed', String(b === e.currentTarget))); draw(); }}, o[1])));
  function draw() {
    const w = state.w / 100; lbl.textContent = state.w + '%';
    out.replaceChildren(h('div', {class:'tw'}, h('table', null, h('thead', null, h('tr', null, h('th', null, 'Estudiante (ejemplo)'), h('th', {class:'n'}, 'Nota laboratorio'), h('th', {class:'n'}, 'Nota resto'), h('th', {class:'n'}, 'Nota final'), h('th', null, 'Resultado'))),
      h('tbody', null, ej.map(r => {
        const fin = r[1] * w + r[2] * (1 - w), okLab = r[1] >= 3, okFin = fin >= 3, pass = okFin && (!state.must || okLab);
        const why = pass ? '' : (!okFin ? ' (la nota final es menor de 3,0)' : ' (no aprobó el laboratorio)');
        return h('tr', null, h('td', null, h('b', null, r[0])), h('td', {class:'n'}, dec(r[1])), h('td', {class:'n'}, dec(r[2])), h('td', {class:'n'}, dec(fin)), h('td', {class:pass ? 'ok' : 'no'}, (pass ? '✓ Aprueba' : '✕ No aprueba') + why));
      })))));
  }
  const root = h('section', {class:'slide'}, h('div', {class:'kicker'}, 'Cómo cuenta en la nota'), h('h1', null, 'El laboratorio vale entre 15 % y 30 % de la nota y hay que aprobarlo'),
    h('p', {class:'lead'}, 'Esta es la regla recomendada. Mueva el peso o cambie la regla para ver cómo cambia el resultado de tres estudiantes de ejemplo.'),
    h('div', {class:'grid g3'}, h('div', {class:'card'}, h('label', {class:'field'}, h('span', null, 'Peso del laboratorio: ', lbl), slider)),
      h('div', {class:'card'}, h('div', {class:'field'}, h('span', null, '¿Hay que aprobar el laboratorio para aprobar la materia?'), seg)),
      h('div', {class:'card'}, h('p', {class:'muted'}, 'El mínimo aprobatorio de 3,0 es un valor de ejemplo; debe verificarse contra el reglamento estudiantil.'))), out);
  draw(); return root;
}

/* 7. Camino del estudiante */
function s7() {
  const cols = [];
  for (let k = 1; k <= 11; k++) {
    const list = k === 11 ? S.filter(s => s.type === 'Electiva') : S.filter(s => s.sem === k);
    cols.push(h('div', {class:'c'}, h('h3', null, k === 11 ? 'Electivas' : k + '.º'),
      list.map(s => { const d = h('span', {class:'dt', style:{'--lc':lc(s.prim)}}); return bindTip(d, () => '<b>' + esc(s.code + ' ' + s.name) + '</b><br>' + esc(LB[s.prim].short)); }),
      h('span', {class:'muted', style:{fontSize:'12px'}}, list.length)));
  }
  return h('section', {class:'slide'}, h('div', {class:'kicker'}, 'El camino del estudiante'), h('h1', null, 'A lo largo de la carrera, el estudiante pasa por los cinco laboratorios'),
    h('p', {class:'lead'}, 'Cada punto es una asignatura, del color de su laboratorio principal. Las electivas profesionales se ofrecen del 7.º al 10.º semestre.'),
    h('div', {class:'legend'}, LID.map(labTag)), h('div', {class:'sem'}, cols),
    h('p', {class:'muted'}, 'El programa tiene 10 semestres; el semestre de cada asignatura se toma del primer dígito de su código, porque los documentos declaran semestres hasta el 12.º. Sirve después para repartir espacios y horarios.'));
}

/* 8. Qué sigue */
function s8() {
  const medio = S.filter(s => s.fit === 'Medio').length;
  const step = (n, t, p) => h('div', {class:'step'}, h('div', {class:'n'}, n), h('div', null, h('h3', null, t), h('p', null, p)));
  return h('section', {class:'slide'}, h('div', {class:'kicker'}, 'Qué sigue'), h('h1', null, 'Tres pasos, en este orden'),
    h('div', {class:'steps'},
      step(1, 'Validar con los docentes', 'Revisar con quien coordina cada asignatura, empezando por las ' + medio + ' asignaciones de ajuste medio.'),
      step(2, 'Ajustar los documentos de cada asignatura', 'Agregar la práctica, la entrega y el peso. Corregir 6 tablas de evaluación que no suman 100 %, 3 códigos repetidos y los semestres declarados.'),
      step(3, 'Asignar espacios y horarios', 'Definir dónde y cuándo funciona cada laboratorio según la demanda de cada semestre.')),
    h('div', {class:'card'}, h('h3', null, 'Para resolver en paralelo'), h('ul', {class:'risk'},
      h('li', null, 'Logística: computadores y software obsoletos; solo 4 estudiantes a la vez. Hay una compra aprobada de COP 42,1 millones sin entregar.'),
      h('li', null, 'Manufactura Flexible: su informe no trae normas de seguridad para robots, CNC y PLC.'),
      h('li', null, 'Financiero y Consultorio: perdieron su espacio tras el sismo del 10 de agosto de 2026.'))),
    h('div', null, h('a', {class:'ghost', href:'presentacion/presentacion_interactiva.html'}, 'Ver el análisis detallado →')));
}

const SLIDES = [
  ['Portada', s1, ['Resume el análisis de ' + M.n + ' asignaturas y 5 laboratorios del programa.', 'Son 8 pasos: el problema, los laboratorios, la propuesta, un ejemplo, la nota, el camino del estudiante y qué sigue.', 'Microcurrículo es el documento que describe cada asignatura.']],
  ['El problema', s2, ['Cada punto es una asignatura. Hoy solo ' + M.now + ' nombran un laboratorio.', M.empty8 + ' ni siquiera describen una práctica de laboratorio o proyecto.', 'Los laboratorios ofrecen ' + M.claimed + ' usos y solo ' + M.confirmed + ' aparecen en la asignatura.', 'Pulse «Propuesta» para ver el resultado: las ' + M.n + ' con laboratorio.']],
  ['Los laboratorios', s3, ['Cinco espacios, cada uno con su tema.', 'El Consultorio no tiene equipos: trabaja con empresas reales.', 'Abra cada tarjeta para ver qué asignaturas tendría.']],
  ['La propuesta', s4, ['Una asignatura tiene un laboratorio principal, que se evalúa, y puede tener apoyos puntuales.', 'Toque una asignatura para ver por qué quedó ahí.', 'Los casos de ajuste medio se validan con los docentes.']],
  ['Un ejemplo', s5, ['Elija una asignatura y recorra: hoy, propuesta y nota.', 'Lo importante: no se agrega carga; se convierte un trabajo que la asignatura ya pide.']],
  ['En la nota', s6, ['Regla recomendada: aprobar el laboratorio para aprobar la materia.', 'Cambie el peso y la regla para ver cómo cambia el resultado de los tres ejemplos.', 'Hay que validarla con el reglamento estudiantil.']],
  ['El camino', s7, ['Cada punto es una asignatura, coloreada por su laboratorio.', 'Sirve para repartir espacios y horarios en la siguiente etapa.', 'El semestre sale del primer dígito del código; las electivas van del 7.º al 10.º.']],
  ['Qué sigue', s8, ['Son tres pasos en orden.', 'Los riesgos de abajo se atienden en paralelo.', 'Quien quiera el detalle puede abrir el análisis detallado.']],
];
let cur = 0;
function go(i) { location.hash = 'paso-' + (i + 1); }
function route() {
  const m = /^#paso-(\d+)$/.exec(location.hash); cur = m ? Math.min(SLIDES.length - 1, Math.max(0, +m[1] - 1)) : 0;
  $('#stage').replaceChildren(SLIDES[cur][1]());
  $('#prog').replaceChildren(...SLIDES.map((s, i) => h('button', {type:'button', title:s[0], class:i < cur ? 'done' : '', 'aria-current':i === cur ? 'step' : null, onclick:() => go(i)}, i === cur ? (i + 1) + ' · ' + s[0] : i + 1)));
  $('#prev').disabled = cur === 0; $('#next').disabled = cur === SLIDES.length - 1; $('#count').textContent = SLIDES[cur][0] + ' · ' + (cur + 1) + ' de ' + SLIDES.length;
  const say = $('#say'); say.replaceChildren(h('b', null, 'Para explicar'), h('ul', null, SLIDES[cur][2].map(t => h('li', null, t))));
  tip.hidden = true; window.scrollTo(0, 0);
}
$('#prev').onclick = () => go(cur - 1); $('#next').onclick = () => go(cur + 1);
$('#say-btn').onclick = e => { const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on)); $('#say').hidden = !on; document.body.classList.toggle('has-say', on); };
$('#theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
addEventListener('hashchange', route);
addEventListener('keydown', e => { if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return; if (e.key === 'ArrowRight' && cur < SLIDES.length - 1) go(cur + 1); if (e.key === 'ArrowLeft' && cur > 0) go(cur - 1); });
$('#mark').replaceChildren(...LID.map(l => h('i', {style:{'--lc':lc(l)}})), h('i', {style:{'--lc':'var(--ink3)'}}));
route();
</script>
