<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorios y Microcurrículos de Ingeniería Industrial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Concepto: tablero de análisis de una dirección de programa. Barra lateral de secciones, escenario central, ficha lateral por asignatura.
   Los cinco laboratorios tienen un color fijo en todo el documento. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --surface2:#eceff4; --ink:#14181f; --ink2:#3a4352; --ink3:#667085; --line:#dbe0e8;
  --accent:#1f3a8a; --accent-soft:#e2e8fa; --good:#177a4b; --warn:#a8510a; --bad:#b42318;
  --c-fin:#009E73; --c-geio:#E69F00; --c-log:#0072B2; --c-mf:#D55E00; --c-con:#CC79A7;
  --on-fin:#03140e; --on-geio:#1b1200; --on-log:#ffffff; --on-mf:#1b0900; --on-con:#1f0c16;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --display:'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --surface:#151b24; --surface2:#1c2431; --ink:#eef1f6; --ink2:#c2cad8; --ink3:#8e99ad; --line:#2a3342;
    --accent:#9db6ff; --accent-soft:#1d2848; --good:#4cc38a; --warn:#f0a35a; --bad:#ff8077;
    --c-log:#3da0e0; --on-log:#04121c; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#151b24; --surface2:#1c2431; --ink:#eef1f6; --ink2:#c2cad8; --ink3:#8e99ad; --line:#2a3342;
  --accent:#9db6ff; --accent-soft:#1d2848; --good:#4cc38a; --warn:#f0a35a; --bad:#ff8077;
  --c-log:#3da0e0; --on-log:#04121c; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;line-height:1.2}
h3{font-size:15px;line-height:1.3}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);max-width:1320px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font:600 15px var(--display)}
.brand span{color:var(--ink3);font-size:12px}
.spacer{flex:1}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink2)}
.ghost:hover{background:var(--surface2)}
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:208px minmax(0,1fr);gap:24px;padding-top:20px}
#rail{position:sticky;top:70px;align-self:start;display:flex;flex-direction:column;gap:2px}
#rail button{text-align:left;background:transparent;border:0;border-radius:8px;padding:8px 10px;color:var(--ink2);display:flex;gap:8px;align-items:baseline}
#rail button small{color:var(--ink3);font-variant-numeric:tabular-nums;min-width:16px}
#rail button:hover{background:var(--surface2)}
#rail button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
#stage{min-width:0;outline:none}
.slide{display:flex;flex-direction:column;gap:18px}
.slide>header{display:flex;flex-direction:column;gap:4px}
.slide>header p{color:var(--ink2);max-width:72ch}
.nav2{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.nav2 button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.nav2 button:hover{background:var(--surface2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.eyebrow{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.hero{padding:26px 0 6px;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:40px;line-height:1.05;max-width:18ch}
.lead{font-size:16px;color:var(--ink2);max-width:66ch}
.kpi b{display:block;font:700 30px var(--display);font-variant-numeric:tabular-nums}
.kpi span{color:var(--ink3);font-size:12px}
.sub{color:var(--ink3);font-size:12px}
.muted{color:var(--ink3)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px 1px 6px;background:var(--surface);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--lc,var(--ink3));flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;border:1px solid currentColor}
.p-alto,.p-bad{color:var(--bad)}.p-medio,.p-warn{color:var(--warn)}.p-bajo{color:var(--ink3)}.p-good{color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--ink);text-align:left}
.chip:hover{background:var(--surface2)}
.chip b{font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.bar-row{display:grid;grid-template-columns:minmax(90px,200px) minmax(0,1fr) 76px;gap:10px;align-items:center;padding:3px 0;background:none;border:0;width:100%;text-align:left}
button.bar-row:hover .bar span{filter:brightness(1.08)}
.bar{height:12px;border-radius:3px;background:var(--surface2);overflow:hidden;position:relative}
.bar span{display:block;height:100%;background:var(--accent);border-radius:3px 3px 3px 3px}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface2)}
.stack>*{min-width:3px;border:0;padding:0;background:var(--lc,var(--accent));color:var(--on,var(--ink));font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.legend button{background:none;border:0;padding:2px 0;display:inline-flex;align-items:center;gap:6px;color:inherit}
.legend button[aria-pressed="true"]{font-weight:700;color:var(--ink)}
.legend .dot{border-radius:3px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--surface2);font-weight:600;font-size:12px;color:var(--ink2);white-space:nowrap}
th.s{cursor:pointer}
tbody tr:hover{background:var(--surface2)}
tr.click{cursor:pointer}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.mini{display:flex;height:8px;border-radius:2px;overflow:hidden;gap:1px;width:96px;background:var(--surface2)}
.mini i{display:block;height:100%}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input[type=search],.tools select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.tools input[type=search]{width:100%}
.malla{display:grid;grid-template-columns:repeat(12,minmax(150px,1fr));gap:8px;overflow-x:auto;padding-bottom:8px}
.col h3{font-size:12px;color:var(--ink3);font-weight:600;padding:0 2px 6px;border-bottom:2px solid var(--line);margin-bottom:8px}
.col{display:flex;flex-direction:column;gap:6px}
.node{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--lc,var(--ink3));border-radius:8px;background:var(--surface);padding:6px 8px;font-size:12px;line-height:1.3}
.node b{display:block;font-variant-numeric:tabular-nums}
.node.dim{opacity:.28}
.node.sel{outline:2px solid var(--accent);outline-offset:1px}
.node.pre{box-shadow:0 0 0 2px var(--good)}
.node.dep{box-shadow:0 0 0 2px var(--warn)}
.node .sm{color:var(--ink3);font-size:11px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:40;overflow-y:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 40px 20px;box-shadow:-12px 0 40px rgba(0,0,0,.18)}
#drawer .dh{position:sticky;top:0;background:var(--bg);padding:16px 0 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;z-index:2}
#drawer section{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:30}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:12px;max-width:320px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
ul.l{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
ol.l{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.cell{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:24px;border-radius:5px;font-size:12px;font-weight:700;background:var(--lc);color:var(--on)}
.cell.out{background:transparent;color:var(--ink2);border:1.5px solid var(--lc)}
.cell.minus{background:transparent;color:var(--bad);border:1.5px dashed var(--bad)}
.hm td,.hm th{text-align:center;padding:5px 8px}
.hm td.l,.hm th.l{text-align:left}
.cov{display:inline-block;width:22px;height:22px;border-radius:5px;line-height:22px;text-align:center;font-weight:700;font-size:12px}
.cov2{background:var(--good);color:var(--bg)}.cov1{background:var(--warn);color:var(--bg)}.cov0{background:transparent;border:1.5px solid var(--bad);color:var(--bad)}
.tile{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface2)}
.tile b{font:700 20px var(--display)}
.tile span{font-size:12px;color:var(--ink2)}
.band{height:6px;border-radius:3px;background:var(--lc);margin-bottom:10px}
.cols{display:flex;gap:3px;align-items:flex-end;height:130px}
.cols>div{flex:1 1 0;min-width:0;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.cols>div.bad{background:var(--warn)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.field input[type=number],.field select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.res{display:flex;flex-direction:column;gap:2px;border-radius:10px;padding:12px;border:1px solid var(--line)}
.res b{font:700 18px var(--display)}
.ok{border-color:var(--good)}.ok b{color:var(--good)}
.no{border-color:var(--bad)}.no b{color:var(--bad)}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px}
  #rail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  #rail button{white-space:nowrap}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .hero h1{font-size:30px}
  .bar-row{grid-template-columns:minmax(80px,120px) minmax(0,1fr) 70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Laboratorios y microcurrículos</b><span>Ingeniería Industrial · UTP · FACIEM</span></div>
  <div class="spacer"></div>
  <button class="ghost" id="theme" type="button" aria-label="Cambiar tema claro u oscuro">Tema</button>
</header>
<div class="shell">
  <nav id="rail" aria-label="Secciones"></nav>
  <main id="stage" tabindex="-1"></main>
</div>
<div id="scrim" hidden></div>
<aside id="drawer" hidden aria-label="Ficha de asignatura"></aside>
<div id="tip" hidden></div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const S = D.subjects, LABS = D.labs, LID = D.labIds;
const LN = {FIN:'Financiero',GEIO:'GEIO',LOG:'Logística',MF:'Manufactura Flexible',CON:'Consultorio'};
const $ = (q, el=document) => el.querySelector(q);
const lc = id => 'var(--c-' + id.toLowerCase() + ')';
const lon = id => 'var(--on-' + id.toLowerCase() + ')';
const fmt = n => n.toLocaleString('es-CO');
const sum = (a, f) => a.reduce((t, x) => t + (f ? f(x) : x), 0);
const countBy = (a, f) => { const m = {}; a.forEach(x => { const k = f(x); m[k] = (m[k] || 0) + 1; }); return m; };
const ord = n => n ? n + '.º' : 'Elec.';
const short = (t, n=30) => t.length > n ? t.slice(0, n - 1) + '…' : t;
const hrs = s => s.had + s.hti;

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') { for (const p in v) { if (p.startsWith('--')) e.style.setProperty(p, v[p]); else e.style[p] = v[p]; } }
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
function svg(tag, attrs) { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

const tip = $('#tip');
function bindTip(el, content) {
  const move = e => {
    tip.innerHTML = typeof content === 'function' ? content() : content; tip.hidden = false;
    const w = tip.offsetWidth, hh = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + hh > innerHeight - 8) y = e.clientY - hh - 14;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  };
  el.addEventListener('mousemove', move); el.addEventListener('mouseleave', () => { tip.hidden = true; });
  return el;
}
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const labTag = (id, full) => h('span', {class:'tag', style:{'--lc':lc(id)}}, h('span', {class:'dot'}), full ? LABS[id].name : LN[id]);
const sChip = s => h('button', {class:'chip', type:'button', title:s.name, style:{'--lc':lc(s.asg.prim)}, onclick:() => openSubject(s.id)}, h('span', {class:'dot'}), h('b', null, s.code), ' ', short(s.name, 26));
const chipsOf = ids => h('div', {class:'chips'}, ids.map(i => sChip(S[i])));
const sev = v => h('span', {class:'pill p-' + v}, (v === 'alto' ? '▲ ' : v === 'medio' ? '● ' : '○ ') + 'prioridad ' + v);
const estPill = e => h('span', {class:'pill ' + (e === 'Coincide' ? 'p-good' : e === 'Cambia' ? 'p-warn' : 'p-bajo')}, (e === 'Coincide' ? '✓ ' : e === 'Cambia' ? '↻ ' : '＋ ') + e.toLowerCase());
const fitPill = f => h('span', {class:'pill ' + (f === 'Alto' ? 'p-good' : 'p-warn')}, 'ajuste ' + f.toLowerCase());
function stack(segs) {
  const tot = sum(segs, s => s.v) || 1;
  return h('div', {class:'stack'}, segs.filter(s => s.v > 0).map(s => {
    const b = h('button', {type:'button', style:{flex:s.v / tot + ' 1 0', '--lc':s.color, '--on':s.on || 'var(--bg)'}, onclick:s.onClick || null, 'aria-label':s.label + ': ' + s.v}, s.show === false ? '' : String(s.v));
    return bindTip(b, () => '<b>' + esc(s.label) + '</b>: ' + s.v);
  }));
}
function barRows(items, o={}) {
  const max = o.max || Math.max(1, ...items.map(i => i.value));
  return h('div', null, items.map(i => {
    const row = h(i.onClick ? 'button' : 'div', {class:'bar-row', type:i.onClick ? 'button' : null, onclick:i.onClick || null},
      h('span', null, i.label, i.sub ? h('span', {class:'sub'}, ' ' + i.sub) : null),
      h('div', {class:'bar'}, h('span', {style:{width:(i.value / max * 100) + '%', background:i.color || 'var(--accent)'}})),
      h('span', {class:'v'}, i.vtext != null ? i.vtext : String(i.value)));
    return row;
  }));
}
function header(t, p) { return h('header', null, h('h2', null, t), p ? h('p', null, p) : null); }

/* ---------------- ficha de asignatura ---------------- */
function openSubject(id) {
  const s = S[id], a = s.asg, d = $('#drawer');
  const kv = (k, v) => h('div', {class:'tile'}, h('b', null, v), h('span', null, k));
  const evalBar = h('div', {class:'stack'}, s.eval.map((e, i) => h('div', {style:{flex:(e.p || 0) + ' 1 0', '--lc':'var(--accent)', opacity:String(1 - (i % 4) * .18), '--on':'var(--bg)'}}, e.p + '%')));
  d.replaceChildren(
    h('div', {class:'dh'}, h('div', {style:{flex:'1',minWidth:'0'}}, h('div', {class:'eyebrow'}, s.code + ' · ' + s.area + ' · ' + s.type), h('h2', null, s.name)),
      h('button', {class:'ghost', type:'button', onclick:closeDrawer, 'aria-label':'Cerrar ficha'}, 'Cerrar ✕')),
    h('section', null, h('div', {class:'grid g4'}, kv('semestre (malla de 10)', ord(s.sem)), kv('créditos / ECTS', s.cred + ' / ' + s.ects), kv('HAD + HTI', s.had + ' + ' + s.hti), kv('RAP', s.rap.join(', ') || '—')),
      h('div', {class:'sub'}, 'Se imparte en: ' + s.semTxt + ' · actualización: ' + s.upd + ' · coordinador: ' + (s.coord || '— (no declarado)'))),
    h('section', {style:{'--lc':lc(a.prim)}}, h('h3', null, 'Asignación de laboratorio propuesta'),
      h('div', {class:'chips'}, labTag(a.prim, true), fitPill(a.fit), estPill(a.estado), a.mod ? h('span', {class:'pill p-bajo'}, 'modalidad ' + a.mod.toLowerCase()) : null),
      h('p', null, h('b', null, 'Por qué: '), a.why), h('p', null, h('b', null, 'Práctica: '), a.pract), h('p', null, h('b', null, 'Evidencia evaluable: '), a.prod),
      h('p', null, h('b', null, 'Peso y horas: '), a.peso + '% de la nota final · ' + a.horas + ' h de las ' + s.had + ' HAD'),
      h('p', null, h('b', null, 'Convierte (no suma carga): '), a.conv),
      h('div', {class:'chips'}, h('span', {class:'sub'}, 'Complementarios:'), a.comps.length ? a.comps.map(c => labTag(c)) : h('span', {class:'sub'}, 'ninguno'), h('span', {class:'sub'}, ' · Hoy declara:'), a.antes.length ? a.antes.map(c => labTag(c)) : h('span', {class:'sub'}, s.generic ? 'laboratorios de FACIEM (genérico)' : 'ningún laboratorio'))),
    h('section', null, h('h3', null, 'Descripción y objetivo'), h('p', null, s.desc || '—'), h('p', null, h('b', null, 'Objetivo: '), s.obj || '—')),
    h('section', null, h('h3', null, 'Resultados de aprendizaje (' + s.outcomes.length + ')'), s.outcomes.length ? h('ul', {class:'l'}, s.outcomes.map(o => h('li', null, o))) : h('p', {class:'muted'}, 'No identificados.'),
      h('div', {class:'sub'}, 'Formación integral: ' + (s.comps.join(', ') || '—'))),

/* ---------------- enrutamiento ---------------- */
const SLIDES = [['resumen','Resumen',rResumen],['programa','Programa',rPrograma],['malla','Malla',rMalla],['estructura','Estructura académica',rEstructura],['calidad','Calidad de datos',rCalidad],['laboratorios','Laboratorios',rLabs],['matriz','Matriz lab × asignatura',rMatriz],['asignacion','Asignación propuesta',rAsignacion],['evaluacion','Componente evaluativo',rEval],['cierre','Siguientes pasos',rCierre]];
function go(id) { if (location.hash === '#' + id) route(); else location.hash = id; }
function route() {
  const id = (location.hash || '#resumen').slice(1), i = Math.max(0, SLIDES.findIndex(s => s[0] === id)), sl = SLIDES[i];
  $('#rail').replaceChildren(...SLIDES.map((s, k) => h('button', {type:'button', 'aria-current':k === i ? 'page' : null, onclick:() => go(s[0])}, h('small', null, k + 1), s[1])));
  const view = sl[2]();
  const nav = h('div', {class:'nav2'}, i > 0 ? h('button', {type:'button', onclick:() => go(SLIDES[i - 1][0])}, '← ' + SLIDES[i - 1][1]) : h('span'), i < SLIDES.length - 1 ? h('button', {type:'button', onclick:() => go(SLIDES[i + 1][0])}, SLIDES[i + 1][1] + ' →') : h('span'));
  if (!view.querySelector(':scope > .nav2')) view.append(nav);
  $('#stage').replaceChildren(view); tip.hidden = true; closeDrawer(); window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDrawer(); return; }
  if (['INPUT','SELECT','TEXTAREA'].includes((e.target.tagName || '')) || !$('#drawer').hidden) return;
  const id = (location.hash || '#resumen').slice(1), i = SLIDES.findIndex(s => s[0] === id);
  if (e.key === 'ArrowRight' && i < SLIDES.length - 1) go(SLIDES[i + 1][0]); if (e.key === 'ArrowLeft' && i > 0) go(SLIDES[i - 1][0]);
});
$('#theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
route();
